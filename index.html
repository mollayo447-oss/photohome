<title>네컷 포토부스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: booth stage on the left, the printed strip on the right; stacks on phones */
:root {
  --bg: #f3f1f6;
  --surface: #ffffff;
  --fg: #1e1b26;
  --muted: #6c6779;
  --line: #e2dee9;
  --accent: #ff4f79;
  --accent-ink: #ffffff;
  --stage: #17151d;
  --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --font-mono: "DM Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131118; --surface: #1d1a24; --fg: #f1eef6; --muted: #a39db1;
    --line: #2e2a37; --accent: #ff6b8e; --accent-ink: #1a0f14; --stage: #0b0a0e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131118; --surface: #1d1a24; --fg: #f1eef6; --muted: #a39db1;
  --line: #2e2a37; --accent: #ff6b8e; --accent-ink: #1a0f14; --stage: #0b0a0e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 24px; }
header h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 42px); margin: 0; line-height: 1.1; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); }
.main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } }

.booth { display: grid; gap: 14px; min-width: 0; }
.stage {
  position: relative; aspect-ratio: 4 / 3; max-width: 100%; width: 100%;
  background: var(--stage); border-radius: 18px; overflow: hidden;
}
.stage video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.stage .count {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-size: clamp(80px, 20vw, 160px); color: #fff;
  text-shadow: 0 4px 30px rgba(0,0,0,.5); pointer-events: none;
}
.stage .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.stage .flash.on { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: .95 } 100% { opacity: 0 } }
.stage .shotno {
  position: absolute; top: 12px; left: 12px; font-family: var(--font-mono); font-size: 13px;
  background: rgba(0,0,0,.55); color: #fff; padding: 4px 10px; border-radius: 999px;
}
.stage .rec { position: absolute; top: 16px; right: 16px; width: 10px; height: 10px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 0 4px rgba(255,59,59,.25); }
.nocam {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #d9d4e4; padding: 20px;
}
.nocam strong { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: #fff; margin-bottom: 6px; }
.nocam p { margin: 0; font-size: 14px; max-width: 34ch; }

.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.thumb {
  aspect-ratio: 4 / 3; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--surface);
  display: grid; place-items: center; overflow: hidden; position: relative; cursor: pointer; padding: 0;
  color: var(--muted); font-family: var(--font-mono); font-size: 13px;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.filled { border-style: solid; border-color: transparent; }
.thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
button.btn {
  font: 500 15px/1 var(--font-body); border-radius: 999px; padding: 13px 22px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
}
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button.btn:disabled { opacity: .45; cursor: default; }
button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }

.side { display: grid; gap: 16px; min-width: 0; justify-items: center; }
.strip-wrap { width: min(100%, 260px); }
#strip { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 14px 40px rgba(20, 10, 40, .18), 0 2px 6px rgba(20,10,40,.12); }
.panel { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 14px; }
.field { display: grid; gap: 8px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid var(--line); padding: 0;
}
.swatch[aria-pressed="true"] { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.chip {
  font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--fg);
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.swatch:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"] {
  font: 15px var(--font-body); padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--fg); width: 100%;
}
input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.save { width: 100%; }
.toast { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { .stage .flash.on { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1>네컷 포토부스</h1>
    <p>3초 카운트다운에 맞춰 네 번 찍으면 네컷 사진으로 인화돼요.</p>
  </header>

  <div class="main">
    <section class="booth" aria-label="촬영">
      <div class="stage" id="stage">
        <video id="video" playsinline muted hidden></video>
        <div class="nocam" id="nocam">
          <div>
            <strong>카메라를 켜주세요</strong>
            <p id="nocamMsg">'카메라 켜기'를 누르면 시작해요. 카메라를 쓸 수 없는 환경에서는 아래 칸을 눌러 사진을 한 장씩 찍거나 골라 넣을 수 있어요.</p>
          </div>
        </div>
        <span class="shotno" id="shotno" hidden></span>
        <span class="rec" id="rec" hidden></span>
        <div class="count" id="count"></div>
        <div class="flash" id="flash"></div>
      </div>

      <div class="thumbs" id="thumbs"></div>

      <div class="actions">
        <button class="btn primary" id="camBtn" type="button">카메라 켜기</button>
        <button class="btn" id="resetBtn" type="button">다시 찍기</button>
      </div>
      <p class="hint">칸을 누르면 그 칸만 다시 찍거나 사진을 바꿀 수 있어요.</p>
      <input type="file" id="fileInput" accept="image/*" capture="user" hidden>
    </section>

    <aside class="side" aria-label="결과">
      <div class="strip-wrap"><canvas id="strip" width="600" height="1800"></canvas></div>
      <div class="panel">
        <div class="field">
          <span class="label">프레임 색</span>
          <div class="chips" id="frames"></div>
        </div>
        <div class="field">
          <span class="label">필터</span>
          <div class="chips" id="filters"></div>
        </div>
        <div class="field">
          <label class="label" for="caption">하단 문구</label>
          <input type="text" id="caption" maxlength="24" value="오늘의 네컷">
        </div>
        <button class="btn primary save" id="saveBtn" type="button">사진 저장</button>
        <p class="toast" id="toast" role="status"></p>
      </div>
    </aside>
  </div>
</div>

<script>
(() => {
  const FRAMES = [
    { id: 'black', name: '블랙', bg: '#141216', ink: '#ffffff' },
    { id: 'white', name: '화이트', bg: '#fbfaf7', ink: '#1e1b26' },
    { id: 'pink', name: '핑크', bg: '#ffc7d6', ink: '#7a1f3d' },
    { id: 'sky', name: '하늘', bg: '#bfe0ff', ink: '#163d66' },
    { id: 'butter', name: '버터', bg: '#fff0a8', ink: '#5b4a00' },
  ];
  const FILTERS = [
    { id: 'none', name: '원본', css: 'none' },
    { id: 'bw', name: '흑백', css: 'grayscale(1) contrast(1.1)' },
    { id: 'warm', name: '따뜻하게', css: 'sepia(.25) saturate(1.2) brightness(1.04)' },
    { id: 'soft', name: '뽀샤시', css: 'brightness(1.12) contrast(.92) saturate(1.05)' },
  ];
  // Strip geometry: 2x6 inch ratio, four 4:3 cuts
  const W = 600, H = 1800, PAD = 30, GAP = 15, CW = W - PAD * 2, CH = Math.round(CW * 3 / 4);

  const $ = id => document.getElementById(id);
  const video = $('video'), strip = $('strip'), sctx = strip.getContext('2d');
  const shots = [null, null, null, null]; // each: canvas 4:3 (unfiltered)
  const state = { frame: 'black', filter: 'none' };
  let stream = null, busy = false, pickSlot = 0;

  try { const s = JSON.parse(localStorage.getItem('fourcut-style') || '{}'); if (s.frame) state.frame = s.frame; if (s.filter) state.filter = s.filter; } catch (e) {}
  const remember = () => { try { localStorage.setItem('fourcut-style', JSON.stringify(state)); } catch (e) {} };

  // ---- chips
  function buildChips() {
    $('frames').innerHTML = '';
    FRAMES.forEach(f => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'swatch'; b.style.background = f.bg;
      b.setAttribute('aria-label', f.name + ' 프레임'); b.title = f.name;
      b.setAttribute('aria-pressed', String(state.frame === f.id));
      b.onclick = () => { state.frame = f.id; remember(); buildChips(); render(); };
      $('frames').appendChild(b);
    });
    $('filters').innerHTML = '';
    FILTERS.forEach(f => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = f.name;
      b.setAttribute('aria-pressed', String(state.filter === f.id));
      b.onclick = () => { state.filter = f.id; remember(); buildChips(); render(); renderThumbs(); };
      $('filters').appendChild(b);
    });
  }

  // ---- thumbnails
  function renderThumbs() {
    const box = $('thumbs'); box.innerHTML = '';
    const css = FILTERS.find(f => f.id === state.filter).css;
    shots.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'thumb' + (c ? ' filled' : '');
      b.setAttribute('aria-label', (i + 1) + '번째 컷 ' + (c ? '다시 찍기' : '찍기'));
      if (c) { const img = new Image(); img.src = c.toDataURL('image/jpeg', .8); img.alt = ''; img.style.filter = css; b.appendChild(img); }
      else b.textContent = (i + 1) + ' / 4';
      b.onclick = () => retake(i);
      box.appendChild(b);
    });
  }

  // ---- strip render
  function drawCover(ctx, src, sw, sh, x, y, w, h) {
    const r = w / h, sr = sw / sh;
    let cx = 0, cy = 0, cw = sw, ch = sh;
    if (sr > r) { cw = sh * r; cx = (sw - cw) / 2; } else { ch = sw / r; cy = (sh - ch) / 2; }
    ctx.drawImage(src, cx, cy, cw, ch, x, y, w, h);
  }
  function render() {
    const f = FRAMES.find(x => x.id === state.frame);
    const filt = FILTERS.find(x => x.id === state.filter).css;
    sctx.save();
    sctx.fillStyle = f.bg; sctx.fillRect(0, 0, W, H);
    shots.forEach((c, i) => {
      const y = PAD + i * (CH + GAP);
      if (c) {
        sctx.filter = filt;
        sctx.drawImage(c, PAD, y, CW, CH);
        sctx.filter = 'none';
      } else {
        sctx.fillStyle = f.id === 'black' ? '#2a2730' : 'rgba(0,0,0,.08)';
        sctx.fillRect(PAD, y, CW, CH);
        sctx.fillStyle = f.id === 'black' ? '#5c5766' : 'rgba(0,0,0,.28)';
        sctx.font = '500 34px "DM Mono", monospace'; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
        sctx.fillText((i + 1) + ' / 4', W / 2, y + CH / 2);
      }
    });
    const footTop = PAD + 4 * CH + 3 * GAP;
    const mid = footTop + (H - footTop) / 2;
    sctx.fillStyle = f.ink; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.font = '48px "Jua", "Noto Sans KR", sans-serif';
    sctx.fillText($('caption').value.trim() || ' ', W / 2, mid - 14);
    const d = new Date();
    const stamp = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
    sctx.globalAlpha = .7; sctx.font = '500 22px "DM Mono", monospace';
    sctx.fillText(stamp, W / 2, mid + 30);
    sctx.restore();
  }

  // ---- camera
  async function startCamera() {
    if (stream) return true;
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
      video.srcObject = stream; await video.play();
      video.hidden = false; $('nocam').hidden = true; $('rec').hidden = false;
      return true;
    } catch (e) {
      $('nocamMsg').textContent = '이 화면에서는 카메라를 바로 쓸 수 없어요. 아래 1/4 칸부터 차례로 눌러 사진을 찍거나 골라 넣어 주세요.';
      $('camBtn').textContent = '사진으로 채우기';
      return false;
    }
  }
  function grab() {
    const c = document.createElement('canvas'); c.width = 1200; c.height = 900;
    const x = c.getContext('2d');
    x.translate(c.width, 0); x.scale(-1, 1); // mirror like a selfie booth
    drawCover(x, video, video.videoWidth, video.videoHeight, 0, 0, c.width, c.height);
    return c;
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function countdownShot(i) {
    $('shotno').hidden = false; $('shotno').textContent = (i + 1) + ' / 4';
    for (let n = 3; n > 0; n--) { $('count').textContent = n; await wait(1000); }
    $('count').textContent = '';
    const fl = $('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
    shots[i] = grab(); renderThumbs(); render();
    await wait(700);
  }
  async function runSession(indices) {
    if (busy) return; busy = true; setButtons();
    for (const i of indices) await countdownShot(i);
    $('shotno').hidden = true; busy = false; setButtons();
    if (shots.every(Boolean)) toast('완성! 프레임과 필터를 골라 저장해 보세요.');
  }
  function setButtons() { $('camBtn').disabled = busy; $('resetBtn').disabled = busy; }

  // ---- file fallback
  function pickFile(i) { pickSlot = i; $('fileInput').value = ''; $('fileInput').click(); }
  $('fileInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = 1200; c.height = 900;
      drawCover(c.getContext('2d'), img, img.naturalWidth, img.naturalHeight, 0, 0, 1200, 900);
      URL.revokeObjectURL(url); shots[pickSlot] = c; renderThumbs(); render();
      const next = shots.findIndex(s => !s);
      if (next === -1) toast('완성! 프레임과 필터를 골라 저장해 보세요.'); else toast((next + 1) + '번째 칸을 눌러 다음 사진을 넣어 주세요.');
    };
    img.src = url;
  });

  async function retake(i) {
    if (busy) return;
    if (stream) runSession([i]); else pickFile(i);
  }
  $('camBtn').onclick = async () => {
    if (busy) return;
    const ok = await startCamera();
    if (ok) { $('camBtn').textContent = '촬영 시작'; $('camBtn').onclick = () => runSession(shots.map((_, i) => i)); }
    else { const next = shots.findIndex(s => !s); pickFile(next === -1 ? 0 : next); }
  };
  $('resetBtn').onclick = () => { if (busy) return; shots.fill(null); renderThumbs(); render(); toast(''); };
  $('caption').addEventListener('input', render);

  // ---- save
  function toast(t) { $('toast').textContent = t; }
  let downloads = null;
  if (window.claude?.use) window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  $('saveBtn').onclick = () => {
    if (!shots.some(Boolean)) { toast('먼저 사진을 찍어 주세요.'); return; }
    const d = new Date();
    const name = 'fourcut-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '.png';
    strip.toBlob(async blob => {
      if (downloads) {
        try { await downloads.save({ filename: name, data: blob }); toast('저장했어요.'); }
        catch (e) { toast(e && e.code === 'declined' ? '저장을 취소했어요.' : '이 화면에서는 저장할 수 없어요. 결과 이미지를 길게 눌러 저장해 주세요.'); }
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        toast('저장했어요.');
      }
    }, 'image/png');
  };

  buildChips(); renderThumbs(); render();
  if (document.fonts?.ready) document.fonts.ready.then(render);
})();
</script>
